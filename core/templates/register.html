{% extends 'base.html' %}
{% block content %}

<div class="bg-white p-8 rounded-2xl shadow-md max-w-md mx-auto">
    <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="w-full mt-4 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
            Login
        </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
        Don’t have an account?
        <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">
            Register
        </a>
    </p>
</div>

{% endblock %}
